services:
  db:
    image: postgres:17-alpine
    container_name: kelasbit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kelasbit
      POSTGRES_PASSWORD: kelasbit
      POSTGRES_DB: kelasbit
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelasbit -d kelasbit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
